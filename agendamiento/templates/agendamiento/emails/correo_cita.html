<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ asunto }}</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f3f4f6; padding: 20px; color: #333333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .header { background-color: #1d8797; padding: 30px 20px; text-align: center; }
        .header img { max-width: 200px; height: auto; }
        .content { padding: 40px 30px; }
        .content h1 { font-size: 24px; margin-bottom: 20px; color: #0f3856; margin-top: 0; }
        .content p { font-size: 16px; line-height: 1.6; margin-bottom: 15px; color: #4b5563; }
        .details-box { background-color: #f8fafc; border-left: 4px solid #1d8797; padding: 20px; margin: 25px 0; border-radius: 0 8px 8px 0; }
        .details-box p { margin: 0; color: #1e293b; font-size: 16px; }
        .details-box p + p { margin-top: 10px; }
        .footer { background-color: #f9fafb; padding: 20px; text-align: center; font-size: 13px; color: #9ca3af; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- El cid:logo será reemplazado por la imagen adjunta internamente en el correo -->
            <img src="cid:logo" alt="AncaneSoft Logo">
        </div>
        <div class="content">
            <h1>{{ titulo }}</h1>
            <p>Hola <strong>{{ nombre_paciente }}</strong>,</p>
            <p>{{ mensaje_principal|safe }}</p>
            
            <div class="details-box">
                <p><strong>Tipo de cita:</strong> {{ tipo_cita }}</p>
                <p><strong>Fecha y hora:</strong> {{ fecha_hora }}</p>
            </div>
            
            <p>¡Te esperamos en nuestro consultorio!</p>
        </div>
        <div class="footer">
            <p>AncaneSoft - Sistema de agendamiento</p>
            <p>Este es un mensaje automático, por favor no respondas a este correo.</p>
        </div>
    </div>
</body>
</html>
